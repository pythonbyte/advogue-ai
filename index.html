<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advogue.ai — Aguarde</title>
    <meta
      name="description"
      content="Advogue.ai: triagem de publicações, prazos e andamentos para o escritório. Em breve."
    />
    <meta name="theme-color" content="#14110e" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://advogue.ai/" />
    <meta property="og:title" content="Advogue.ai" />
    <meta property="og:description" content="Aguarde. Em breve, para o escritório." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://advogue.ai/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="orb" aria-hidden="true"></div>

    <header class="top">
      <a class="mark" href="/" aria-label="Advogue.ai">
        <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#f4efe6" />
          <path
            d="M9 24 L16 8 L23 24 M11.6 18.2 H20.4"
            fill="none"
            stroke="#14110e"
            stroke-width="2.1"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span>Advogue.ai</span>
      </a>
      <p class="status">
        <span class="dot"></span>
        Em construção
      </p>
    </header>

    <main>
      <p class="eyebrow">Para o escritório brasileiro</p>
      <h1>Aguarde<span class="ellipsis" aria-hidden="true"></span></h1>
      <p class="lede">
        Intimações do diário, prazo CPC e andamentos do processo — juntos, com
        aprovação humana. Sem chute de data. Sem Telegram.
      </p>

      <form id="waitlist" class="waitlist" novalidate>
        <label for="email">Lista de espera</label>
        <div class="row">
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            inputmode="email"
            required
            placeholder="seu@escritorio.com.br"
          />
          <button type="submit" id="submit">Avisar-me</button>
        </div>
        <p class="hint" id="hint">
          Entramos em contato quando o piloto abrir. Sem newsletter.
        </p>
      </form>
    </main>

    <footer>
      <p>© <span id="year"></span> Advogue.ai</p>
      <p>Triagem jurídica. Em breve.</p>
    </footer>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
